name: Release

# This fork publishes its releases as GitHub releases only. It never publishes to
# PyPI, where `xlsxedit` is the upstream project's package. Publishing a GitHub
# release builds the wheel and sdist from its tag, checks that they report the
# tag's version, and attaches them to the release (see CONTRIBUTING.md, Releases).

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build and attach to the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Check that the build reports the tag's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::the wheel reports $version but the release tag is $TAG"
            exit 1
          fi

      # No --clobber: a version's files never change once attached.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
